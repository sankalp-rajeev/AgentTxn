name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy agenttxn txnagentbench baselines services experiments
      - name: Tests (enabled when implementations exist)
        if: ${{ hashFiles('tests/**/test_*.py') != '' }}
        run: python -m pytest
      # Add a deterministic benchmark smoke command when Gate 1 is implemented.
      # Expensive LLM experiments must never run in CI.

  postgres-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Check database readiness
        run: docker compose exec -T postgres pg_isready -U agenttxn -d agenttxn
      - name: Stop services
        if: always()
        run: docker compose down
