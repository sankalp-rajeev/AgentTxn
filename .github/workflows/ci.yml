name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development tools
        run: |
          python -m pip install uv==0.10.2
          uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Type check
        run: uv run --no-sync mypy agenttxn txnagentbench baselines services experiments
      - name: Tests
        run: uv run --no-sync python -m pytest
      # Add a deterministic benchmark smoke command when Gate 1 is implemented.
      # Expensive LLM experiments must never run in CI.

  postgres-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.10.2
          uv sync --locked --extra dev
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Check database readiness
        run: docker compose exec -T postgres pg_isready -U agenttxn -d agenttxn
      - name: PostgreSQL ledger integration
        env:
          AGENTTXN_TEST_DATABASE_URL: postgresql+asyncpg://agenttxn:agenttxn_dev@localhost:5432/agenttxn
        run: uv run --no-sync python -m pytest tests/integration/test_postgres_ledger.py
      - name: Stop services
        if: always()
        run: docker compose down
