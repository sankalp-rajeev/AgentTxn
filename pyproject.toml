[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttxn"
version = "0.1.0"
description = "Experimental semantic concurrency runtime and benchmark for tool-using agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29,<1",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "SQLAlchemy[asyncio]>=2,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6,<7",
    "mypy>=1,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.15,<1",
]
analysis = [
    "matplotlib>=3.8,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agenttxn*", "txnagentbench*", "services*", "baselines*", "experiments*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
agenttxn = ["py.typed", "effects/migrations/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: exercises runtime and service boundaries",
    "property: checks invariants over generated schedules and states",
    "regression: preserves a previously discovered correctness case",
    "benchmark_smoke: deterministic benchmark scenario without LLM calls",
]
